name: Deploy Telegram queue worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: instagram-creative-bot-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
      ROOT_ADMIN_ID: ${{ secrets.ROOT_ADMIN_ID }}
      ADMIN_CLAIM_CODE: ${{ secrets.ADMIN_CLAIM_CODE }}
      KV_TITLE: instagram-creative-bot-config

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Typecheck and tests
        working-directory: worker
        run: npm run check

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }

      - name: Create or find Cloudflare KV
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api?per_page=100")"
          kv_id="$(jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id' <<<"$response" | head -n1)"

          if [[ -z "$kv_id" || "$kv_id" == "null" ]]; then
            response="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -cn --arg title "$KV_TITLE" '{title:$title}')" \
              "$api")"
            kv_id="$(jq -r '.result.id' <<<"$response")"
          fi

          [[ -n "$kv_id" && "$kv_id" != "null" ]] || { echo "Could not resolve KV namespace ID" >&2; exit 1; }
          echo "KV_NAMESPACE_ID=$kv_id" >> "$GITHUB_ENV"

      - name: Generate deploy configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path("worker/wrangler.toml").read_text(encoding="utf-8")
          source = source.replace("__KV_NAMESPACE_ID__", os.environ["KV_NAMESPACE_ID"])
          Path("worker/wrangler.generated.toml").write_text(source, encoding="utf-8")
          PY

      - name: Deploy Worker and durable queue
        working-directory: worker
        run: npx wrangler deploy --config wrangler.generated.toml

      - name: Sync Worker secrets when present
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.generated.toml >/dev/null
              echo "Synced $name"
            else
              echo "Keeping existing Worker secret $name"
            fi
          }

          put_secret TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          put_secret TELEGRAM_WEBHOOK_SECRET "$TELEGRAM_WEBHOOK_SECRET"
          put_secret SETUP_TOKEN "$SETUP_TOKEN"
          put_secret ROOT_ADMIN_ID "$ROOT_ADMIN_ID"
          put_secret ADMIN_CLAIM_CODE "$ADMIN_CLAIM_CODE"

      - name: Resolve Worker URL and finish setup
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain' <<<"$response")"
          [[ -n "$subdomain" && "$subdomain" != "null" ]] || { echo "Could not resolve workers.dev subdomain" >&2; exit 1; }

          worker_url="https://instagram-creative-bot.${subdomain}.workers.dev"
          curl --fail-with-body --silent --show-error "$worker_url/health"
          echo

          if [[ -n "$SETUP_TOKEN" ]]; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $SETUP_TOKEN" \
              "$worker_url/admin/setup"
            echo
          else
            echo "SETUP_TOKEN is absent in GitHub Secrets; existing Telegram webhook was left unchanged."
          fi

          echo "Worker is live: $worker_url"
