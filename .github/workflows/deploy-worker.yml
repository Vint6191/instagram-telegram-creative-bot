name: Deploy Telegram queue worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: instagram-creative-bot-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ROOT_ADMIN_ID: ${{ secrets.ROOT_ADMIN_ID }}
      ADMIN_CLAIM_CODE: ${{ secrets.ADMIN_CLAIM_CODE }}
      KV_TITLE: instagram-creative-bot-config

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Typecheck and tests
        working-directory: worker
        run: npm run check

      - name: Check required credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          normalized_token="$(python -c 'import os; print(os.environ.get("TELEGRAM_BOT_TOKEN", "").strip(), end="")')"
          [[ -n "$normalized_token" ]] || { echo "Missing TELEGRAM_BOT_TOKEN" >&2; exit 1; }

      - name: Create or find Cloudflare KV
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api?per_page=100")"
          kv_id="$(jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id' <<<"$response" | head -n1)"

          if [[ -z "$kv_id" || "$kv_id" == "null" ]]; then
            response="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -cn --arg title "$KV_TITLE" '{title:$title}')" \
              "$api")"
            kv_id="$(jq -r '.result.id' <<<"$response")"
          fi

          [[ -n "$kv_id" && "$kv_id" != "null" ]] || { echo "Could not resolve KV namespace ID" >&2; exit 1; }
          echo "KV_NAMESPACE_ID=$kv_id" >> "$GITHUB_ENV"

      - name: Generate deploy configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path("worker/wrangler.toml").read_text(encoding="utf-8")
          source = source.replace("__KV_NAMESPACE_ID__", os.environ["KV_NAMESPACE_ID"])
          source = source.replace("__BUILD_ID__", os.environ["GITHUB_SHA"])
          Path("worker/wrangler.generated.toml").write_text(source, encoding="utf-8")
          PY

      - name: Deploy Worker and durable queue
        working-directory: worker
        run: npx wrangler deploy --config wrangler.generated.toml

      - name: Sync Worker secrets
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail

          normalize() {
            python -c 'import sys; print(sys.stdin.read().strip(), end="")'
          }

          bot_token="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | normalize)"
          printf '%s' "$bot_token" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.generated.toml >/dev/null
          echo "Synced TELEGRAM_BOT_TOKEN"

          put_optional_secret() {
            local name="$1"
            local value
            value="$(printf '%s' "$2" | normalize)"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.generated.toml >/dev/null
              echo "Synced $name"
            else
              echo "Keeping existing Worker secret $name"
            fi
          }

          put_optional_secret ROOT_ADMIN_ID "$ROOT_ADMIN_ID"
          put_optional_secret ADMIN_CLAIM_CODE "$ADMIN_CLAIM_CODE"

      - name: Configure and verify Telegram webhook
        shell: bash
        run: |
          set -euo pipefail

          bot_token="$(python -c 'import os; print(os.environ["TELEGRAM_BOT_TOKEN"].strip(), end="")')"
          webhook_secret="$(python - <<'PY'
          import hashlib
          import os
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip().encode("utf-8")
          print(hashlib.sha256(token).hexdigest())
          PY
          )"

          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain' <<<"$response")"
          [[ -n "$subdomain" && "$subdomain" != "null" ]] || { echo "Could not resolve workers.dev subdomain" >&2; exit 1; }

          worker_url="https://instagram-creative-bot.${subdomain}.workers.dev"

          # Cloudflare can briefly serve the previous Worker version after deploy
          # and after each secret update. Never validate a release by appVersion
          # alone: older code may have the same human version. Wait for the exact
          # Git commit and for the catalog to exist in Durable Object SQLite.
          ready=0
          health=""
          for attempt in {1..60}; do
            health="$(curl --silent --show-error \
              -H "Cache-Control: no-cache" \
              "$worker_url/health?build=${GITHUB_SHA}&attempt=${attempt}" || true)"

            if jq -e \
              --arg build "$GITHUB_SHA" \
              '.ok == true
               and .appVersion == "4.0.2"
               and .architecture == "creative-reference-split-v4"
               and .referenceProtocol == 5
               and .buildId == $build
               and .references.catalogNiches == 473
               and .references.catalogStoredNiches == 473
               and .references.catalogReady == true' \
              >/dev/null 2>&1 <<<"$health"; then
              ready=1
              break
            fi

            echo "Waiting for exact Worker build and ready catalog ($attempt/60)..."
            [[ -n "$health" ]] && echo "$health"
            sleep 5
          done

          [[ "$ready" == "1" ]] || {
            echo "The exact Worker build never became ready" >&2
            echo "Expected buildId: $GITHUB_SHA" >&2
            echo "$health" >&2
            exit 1
          }
          echo "$health"

          # Secret updates create a new Worker version. Wait until that version
          # accepts the webhook secret derived from the current bot token.
          ready=0
          for attempt in {1..18}; do
            code="$(curl --silent --show-error \
              --output webhook-probe.txt \
              --write-out '%{http_code}' \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-Telegram-Bot-Api-Secret-Token: $webhook_secret" \
              --data '{"update_id":0}' \
              "$worker_url/telegram/webhook" || true)"
            if [[ "$code" == "200" ]]; then
              ready=1
              break
            fi
            echo "Worker is applying the new Telegram token ($attempt/18, HTTP $code)..."
            sleep 5
          done
          [[ "$ready" == "1" ]] || {
            echo "Worker never accepted the webhook secret for the current bot token" >&2
            cat webhook-probe.txt >&2 || true
            exit 1
          }

          api="https://api.telegram.org/bot${bot_token}"
          me="$(curl --fail-with-body --silent --show-error -X POST "$api/getMe")"
          [[ "$(jq -r '.ok' <<<"$me")" == "true" ]] || { echo "$me" >&2; exit 1; }

          webhook_payload="$(jq -cn \
            --arg url "$worker_url/telegram/webhook" \
            --arg secret "$webhook_secret" \
            '{url:$url,secret_token:$secret,allowed_updates:["message","callback_query"],drop_pending_updates:false,max_connections:10}')"
          webhook="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$webhook_payload" \
            "$api/setWebhook")"
          [[ "$(jq -r '.ok' <<<"$webhook")" == "true" ]] || { echo "$webhook" >&2; exit 1; }

          commands='{"commands":[{"command":"start","description":"Открыть бота"},{"command":"menu","description":"Главное меню владельца"},{"command":"creatives","description":"Управление креативами"},{"command":"references","description":"Управление референсами"},{"command":"creative","description":"Добавить текущий чат в креативы"},{"command":"reference","description":"Добавить текущую группу модели"},{"command":"warehouse","description":"Назначить склад референсов"},{"command":"users","description":"Управление доступом"},{"command":"join","description":"Войти по приглашению"},{"command":"claim","description":"Назначить владельца"}]}'
          commands_result="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$commands" \
            "$api/setMyCommands")"
          [[ "$(jq -r '.ok' <<<"$commands_result")" == "true" ]] || { echo "$commands_result" >&2; exit 1; }

          info="$(curl --fail-with-body --silent --show-error -X POST "$api/getWebhookInfo")"
          [[ "$(jq -r '.ok' <<<"$info")" == "true" ]] || { echo "$info" >&2; exit 1; }
          actual_url="$(jq -r '.result.url // empty' <<<"$info")"
          [[ "$actual_url" == "$worker_url/telegram/webhook" ]] || {
            echo "Telegram returned the wrong webhook URL: $actual_url" >&2
            exit 1
          }

          bot_username="$(jq -r '.result.username // empty' <<<"$me")"
          pending="$(jq -r '.result.pending_update_count // 0' <<<"$info")"
          echo "Telegram bot: @${bot_username}"
          echo "Webhook configured and verified: $actual_url"
          echo "Pending Telegram updates: $pending"
          echo "Worker is live: $worker_url"
