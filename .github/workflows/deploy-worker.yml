name: Deploy Telegram queue worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_TITLE: instagram-creative-bot-config

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Test
        working-directory: worker
        run: npm test

      - name: Create or find Cloudflare KV
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api?per_page=100")"
          kv_id="$(jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id' <<<"$response" | head -n1)"

          if [[ -z "$kv_id" || "$kv_id" == "null" ]]; then
            response="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -cn --arg title "$KV_TITLE" '{title:$title}')" \
              "$api")"
            kv_id="$(jq -r '.result.id' <<<"$response")"
          fi

          if [[ -z "$kv_id" || "$kv_id" == "null" ]]; then
            echo "Could not resolve KV namespace ID" >&2
            exit 1
          fi
          echo "KV_NAMESPACE_ID=$kv_id" >> "$GITHUB_ENV"

      - name: Generate deploy configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path("worker/wrangler.toml").read_text(encoding="utf-8")
          source = source.replace("__KV_NAMESPACE_ID__", os.environ["KV_NAMESPACE_ID"])
          Path("worker/wrangler.generated.toml").write_text(source, encoding="utf-8")
          PY

      - name: Deploy Worker and durable queue
        working-directory: worker
        run: npx wrangler deploy --config wrangler.generated.toml

      - name: Resolve Worker URL and configure Telegram webhook
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain' <<<"$response")"
          if [[ -z "$subdomain" || "$subdomain" == "null" ]]; then
            echo "Could not resolve workers.dev subdomain" >&2
            exit 1
          fi

          setup_token="$(python - <<'PY'
          import re
          from pathlib import Path
          source = Path("worker/src/preconfigured.ts").read_text(encoding="utf-8")
          match = re.search(r'PRECONFIGURED_SETUP_TOKEN\s*=\s*"([^"]+)"', source)
          if not match:
              raise SystemExit("PRECONFIGURED_SETUP_TOKEN not found")
          print(match.group(1))
          PY
          )"

          worker_url="https://instagram-creative-bot.${subdomain}.workers.dev"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $setup_token" \
            "$worker_url/admin/setup"
          echo "Worker is live: $worker_url"
