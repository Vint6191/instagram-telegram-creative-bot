name: Process Instagram creative

run-name: "Instagram creative · ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      url:
        description: Canonical Instagram URL
        required: true
        type: string
      requester_id:
        description: Telegram user ID that submitted the link
        required: true
        type: string
      source_chat_id:
        description: Telegram chat containing the status message
        required: true
        type: string
      status_message_id:
        description: Telegram status message ID
        required: true
        type: string
      target_chat_id:
        description: Telegram destination chat ID snapshot
        required: true
        type: string
      request_id:
        description: Unique request ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: instagram-creative-session
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: downloader/pyproject.toml

      - name: Install FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install downloader
        run: python -m pip install --upgrade ./downloader

      - name: Prepare Instagram cookies
        env:
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          ENCRYPTED_COOKIE_PAYLOAD_B64: ""
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createDecipheriv, createHash } = require("node:crypto");
          const { chmodSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");

          const token = (process.env.WORKER_GITHUB_TOKEN || "").trim();
          if (!token) throw new Error("Missing WORKER_GITHUB_TOKEN");

          const payload = JSON.parse(
            Buffer.from(process.env.ENCRYPTED_COOKIE_PAYLOAD_B64, "base64").toString("utf8")
          );
          const key = createHash("sha256")
            .update(payload.context, "utf8")
            .update("\0", "utf8")
            .update(token, "utf8")
            .digest();

          const decipher = createDecipheriv(
            "aes-256-gcm",
            key,
            Buffer.from(payload.ivBase64, "base64")
          );
          decipher.setAAD(Buffer.from(payload.context, "utf8"));
          decipher.setAuthTag(Buffer.from(payload.authTagBase64, "base64"));

          const cookies = Buffer.concat([
            decipher.update(Buffer.from(payload.ciphertextBase64, "base64")),
            decipher.final(),
          ]).toString("utf8");

          for (const required of ["sessionid", "csrftoken", "ds_user_id"]) {
            if (!cookies.includes(`\t${required}\t`)) {
              throw new Error(`Instagram cookies are missing ${required}`);
            }
          }

          const output = join(process.env.RUNNER_TEMP, "instagram-cookies.txt");
          writeFileSync(output, cookies, { encoding: "utf8", mode: 0o600 });
          chmodSync(output, 0o600);
          console.log("Instagram cookies prepared.");
          NODE

      - name: Download and publish
        id: publish
        env:
          TELEGRAM_BOT_TOKEN: "7799844807:AAFBznwweXnHg9RIO_vwVlfNYtzkJSEf6UE"
          INSTAGRAM_COOKIES_FILE: ${{ runner.temp }}/instagram-cookies.txt
          INSTAGRAM_URL: ${{ inputs.url }}
          SOURCE_CHAT_ID: ${{ inputs.source_chat_id }}
          STATUS_MESSAGE_ID: ${{ inputs.status_message_id }}
          TARGET_CHAT_ID: ${{ inputs.target_chat_id }}
          REQUEST_ID: ${{ inputs.request_id }}
          STATUS_MARKER: /tmp/creative-bot-status-reported
          PYTHONUNBUFFERED: "1"
        run: creative-bot-run

      - name: Report bootstrap failure to Telegram
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: "7799844807:AAFBznwweXnHg9RIO_vwVlfNYtzkJSEf6UE"
          SOURCE_CHAT_ID: ${{ inputs.source_chat_id }}
          STATUS_MESSAGE_ID: ${{ inputs.status_message_id }}
          STATUS_MARKER: /tmp/creative-bot-status-reported
        run: python scripts/report-action-failure.py
