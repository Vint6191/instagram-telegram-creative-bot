name: Process Instagram creative

run-name: "Instagram creative · ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      url:
        description: Canonical Instagram URL
        required: true
        type: string
      requester_id:
        description: Telegram user ID that submitted the link
        required: true
        type: string
      source_chat_id:
        description: Telegram chat containing the status message
        required: true
        type: string
      status_message_id:
        description: Telegram status message ID
        required: true
        type: string
      target_chat_id:
        description: Telegram destination chat ID snapshot
        required: true
        type: string
      request_id:
        description: Unique request ID
        required: true
        type: string

permissions:
  contents: read

# Один Instagram-сеанс за раз. Это бережёт cookies и снижает шанс rate limit.
concurrency:
  group: instagram-creative-session
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: downloader/pyproject.toml

      - name: Install FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install downloader
        run: python -m pip install --upgrade ./downloader


      - name: Fetch Instagram cookies
        env:
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WORKER_GITHUB_TOKEN" ]]; then
            echo "Missing WORKER_GITHUB_TOKEN" >&2
            exit 1
          fi

          cookie_file="$RUNNER_TEMP/instagram-cookies.txt"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            -H "Authorization: Bearer $WORKER_GITHUB_TOKEN" \
            "https://instagram-creative-bot.hellvint6191.workers.dev/internal/instagram-cookies" \
            --output "$cookie_file"

          grep -q '^# Netscape HTTP Cookie File' "$cookie_file"
          grep -q $'\tsessionid\t' "$cookie_file"
          grep -q $'\tcsrftoken\t' "$cookie_file"
          grep -q $'\tds_user_id\t' "$cookie_file"
          chmod 600 "$cookie_file"

      - name: Download and publish
        id: publish
        env:
          TELEGRAM_BOT_TOKEN: "7799844807:AAFBznwweXnHg9RIO_vwVlfNYtzkJSEf6UE"
          INSTAGRAM_COOKIES_FILE: ${{ runner.temp }}/instagram-cookies.txt
          INSTAGRAM_URL: ${{ inputs.url }}
          SOURCE_CHAT_ID: ${{ inputs.source_chat_id }}
          STATUS_MESSAGE_ID: ${{ inputs.status_message_id }}
          TARGET_CHAT_ID: ${{ inputs.target_chat_id }}
          REQUEST_ID: ${{ inputs.request_id }}
          STATUS_MARKER: /tmp/creative-bot-status-reported
          PYTHONUNBUFFERED: "1"
        run: creative-bot-run

      - name: Report bootstrap failure to Telegram
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: "7799844807:AAFBznwweXnHg9RIO_vwVlfNYtzkJSEf6UE"
          SOURCE_CHAT_ID: ${{ inputs.source_chat_id }}
          STATUS_MESSAGE_ID: ${{ inputs.status_message_id }}
          STATUS_MARKER: /tmp/creative-bot-status-reported
        run: python scripts/report-action-failure.py
