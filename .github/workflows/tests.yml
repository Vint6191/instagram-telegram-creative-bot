name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - working-directory: worker
        run: npm install
      - working-directory: worker
        run: npm run typecheck
      - working-directory: worker
        run: npm test

  downloader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: downloader/pyproject.toml
      - run: python -m pip install -e './downloader[test]'
      - run: pytest -q downloader/tests
